<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- 👇 UPDATED VIEWPORT FOR 100% ZOOM 👇 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>For My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* 🌟 UPDATED BACKGROUND: Slightly darker, warmer center glow */
            background: radial-gradient(circle at center, #f5e4d5 0%, #e8d4c4 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 1.5rem;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        #petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            font-size: 24px;
            animation: fall linear forwards;
            pointer-events: none;
            opacity: 0.7;
            user-select: none;
            will-change: transform, opacity; /* Smoother falling */
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 780px;
            perspective: 2000px;
            position: relative;
            z-index: 1;
        }

        /* ✨ SOFT ROMANTIC GLOW BEHIND THE ENVELOPE */
        .container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            background: radial-gradient(circle, rgba(240, 200, 185, 0.7) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        /* 🧧 UPDATED ENVELOPE: Slightly darker, richer pink/rose shade */
        .envelope {
            position: relative;
            width: 100%;
            min-height: 520px;
            background: #ebd6c8; /* Darker than before */
            border-radius: 20px 20px 8px 8px;
            box-shadow: 0 30px 60px rgba(120, 80, 60, 0.25),
                        0 10px 25px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            /* 🛠️ SMOOTHED ANIMATIONS */
            transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1),
                        box-shadow 0.8s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(200, 170, 140, 0.2);
            overflow: hidden;
            will-change: transform, box-shadow;
            backface-visibility: hidden;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, 
                    transparent,
                    transparent 20px,
                    rgba(200, 170, 140, 0.03) 20px,
                    rgba(200, 170, 140, 0.03) 21px
                );
            pointer-events: none;
        }

        /* 🧧 UPDATED FLAP: Corresponding darker pink */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: #e3cdbd; 
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 2px solid rgba(180, 140, 110, 0.20);
            transition: all 1s cubic-bezier(0.34, 1.2, 0.64, 1);
            pointer-events: none;
            will-change: clip-path, opacity;
            backface-visibility: hidden;
        }

        /* 🖼️ PHOTO FRAME (OUTSIDE) */
        .outside-photo-frame {
            position: absolute;
            top: 25%; 
            left: 8%; 
            transform: rotate(-4deg); 
            width: 40%;
            max-width: 240px;
            background: #ffffff;
            padding: 10px 10px 35px 10px; 
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(80, 40, 20, 0.25), 
                        0 5px 12px rgba(0, 0, 0, 0.08);
            z-index: 10; 
            pointer-events: none; 
            transition: all 0.9s cubic-bezier(0.34, 1.4, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .outside-photo-frame img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 2px;
            object-fit: cover;
        }

        .polaroid-caption {
            font-family: 'Great Vibes', cursive; 
            font-size: 1.3rem; 
            font-weight: bold;
            color: #4d2e1f; 
            text-align: center;
            line-height: 1.1;
            
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: auto; 
            margin-bottom: auto;
        }

        /* 🗓️ FLOATING DATE STAMP */
        .date-stamp {
            position: absolute;
            bottom: 4.5rem;
            left: 1.8rem;
            font-family: 'Great Vibes', cursive;
            font-size: 1.1rem;
            color: rgba(139, 69, 19, 0.25); /* Very faint brown stamp */
            transform: rotate(-3deg);
            pointer-events: none;
            z-index: 1;
            letter-spacing: 1px;
        }

        /* Hide the photo & text when the envelope is opened */
        .envelope.open .outside-photo-frame {
            opacity: 0;
            transform: translate(-40px, -40px) scale(0.8) rotate(-10deg);
            pointer-events: none;
        }

        .envelope-seal {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            opacity: 0.7;
            filter: drop-shadow(0 2px 6px rgba(180, 80, 50, 0.15));
            transition: all 0.6s ease;
            pointer-events: none;
            animation: pulseSeal 2.5s ease-in-out infinite; 
            z-index: 5;
            will-change: transform;
            backface-visibility: hidden;
        }

        @keyframes pulseSeal {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
        }

        /* 📩 "click to open" */
        .envelope-hint {
            position: absolute;
            bottom: 2rem;
            font-family: 'Great Vibes', cursive;
            font-size: 1.4rem;
            color: #704f3d; /* Slightly richer brown */
            opacity: 1.0;    
            letter-spacing: 3px;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        .letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 92%;
            max-width: 680px;
            background: #fffcf7;
            border-radius: 16px;
            padding: 2.5rem 2.2rem 2.2rem 2.5rem;
            box-shadow: 0 20px 50px rgba(80, 40, 20, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.34, 1.4, 0.64, 1);
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: stretch;
            border: 1px solid rgba(200, 170, 140, 0.15);
            z-index: 20;
            will-change: transform, opacity, box-shadow;
            backface-visibility: hidden;
        }

        .envelope.open .letter {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 30px 70px rgba(80, 40, 20, 0.2);
        }

        .envelope.open .envelope-flap {
            clip-path: polygon(0 0, 100% 0, 50% 15%);
            opacity: 0.3;
        }

        .envelope.open .envelope-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .envelope.open .envelope-hint {
            opacity: 0;
        }

        .envelope.open .date-stamp {
            opacity: 0; /* Hide stamp when envelope opens */
        }

        .envelope.open {
            background: #e2ccbe; /* Slightly darker open state */
            box-shadow: 0 20px 50px rgba(100, 60, 30, 0.15);
        }

        .letter-text {
            flex: 1 1 52%;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 0.3rem;
        }

        .greeting {
            font-family: 'Great Vibes', cursive;
            font-size: 2.6rem;
            color: #7a3b2a;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            min-height: 70px;
            text-align: left;
        }

        .greeting small {
            font-size: 1.8rem;
            display: block;
            margin-top: -0.2rem;
            color: #9e5a44;
        }

        .message-body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            color: #4d2e1f;
            line-height: 1.9;
            margin: 0.4rem 0 0.8rem 0;
            padding-left: 1rem;
            border-left: 3px solid #e8c8b0;
            background: rgba(255, 245, 235, 0.3);
            border-radius: 0 8px 8px 0;
            padding: 0.8rem 0.8rem 0.8rem 1rem;
            min-height: 100px;
            text-align: justify;
            text-justify: inter-word;
            word-spacing: 0.05em;
        }

        .message-body .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #7a3b2a;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        .message-body .typewriter-cursor.hidden {
            opacity: 0;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.7rem;
            color: #7a3b2a;
            margin-top: 0rem;
            text-align: right;
            opacity: 0.8;
            min-height: 40px;
        }

        /* 🌷 ORIGINAL FLOWER / TULIP SIDE RESTORED */
        .tulip-side {
            flex: 0 1 38%;
            min-width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 240, 225, 0.2);
            border-radius: 24px;
            padding: 0.2rem;
            position: relative;
            cursor: pointer;
        }

        .tulip-side:hover {
            background: rgba(255, 240, 225, 0.35);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #b08870;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            z-index: 10;
        }

        .close-btn:hover {
            opacity: 0.8;
            background: rgba(180, 140, 110, 0.08);
            transform: rotate(90deg);
        }

        @media (max-width: 640px) {
            .envelope { min-height: 440px; padding: 1.5rem 1rem; }
            .outside-photo-frame { width: 45%; top: 22%; left: 5%; }
            .polaroid-caption { font-size: 1.1rem; } 
            .date-stamp { font-size: 0.9rem; bottom: 3.8rem; left: 1rem; }
            .letter { padding: 1.8rem 1.2rem; flex-direction: column; gap: 0.8rem; width: 95%; }
            .letter-text { flex: 1 1 auto; padding-right: 0; }
            .tulip-side { flex: 0 1 auto; width: 100%; justify-content: center; }
            .greeting { font-size: 2.2rem; }
            .greeting small { font-size: 1.5rem; }
            .message-body { font-size: 0.9rem; padding: 0.4rem 0.6rem; }
            .signature { font-size: 1.4rem; }
            .envelope-seal { font-size: 2.2rem; top: 36%; }
            .envelope-hint { font-size: 1.1rem; }
        }

        @media (max-width: 440px) {
            .letter { padding: 1.2rem 0.8rem; }
            .outside-photo-frame { width: 50%; top: 20%; left: 3%; }
            .polaroid-caption { font-size: 1rem; }
            .date-stamp { font-size: 0.8rem; bottom: 3.2rem; left: 0.8rem; }
            .tulip-side { width: 100%; }
            .greeting { font-size: 1.8rem; min-height: 50px; }
            .greeting small { font-size: 1.2rem; }
            .message-body { font-size: 0.8rem; padding: 0.3rem 0.5rem; min-height: 80px; }
            .envelope-seal { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div id="petals-container"></div>

<div class="container">
    <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>
        
        <!-- 🖼️ PHOTO ON THE OUTSIDE -->
        <div class="outside-photo-frame">
            <!-- Change src="us-together.png" to your actual file name -->
            <img src="us-together.png" alt="Our Picture">
            <div class="polaroid-caption">I love you forever. 😘</div>
        </div>
        
        <!-- 🗓️ DATE STAMP ON THE OUTSIDE -->
        <div class="date-stamp">August 21, 2026 ✦</div>
        
        <div class="envelope-seal">❤️</div>
        <div class="envelope-hint">✉ click to open</div>

        <div class="letter" id="letter">
            <button class="close-btn" id="closeBtn">✕</button>

            <div class="letter-text">
                <div class="greeting" id="greetingText">
                    Happy Monthsary
                    <small>mahal ko ❤️</small>
                </div>
                <div class="message-body" id="messageBody">
                    <span id="typewriterText"></span>
                    <span class="typewriter-cursor" id="cursor"></span>
                </div>
                <div class="signature" id="signatureText">— always, yours</div>
            </div>

            <!-- 🌷 RESTORED FLOWER BOUQUET -->
            <div class="tulip-side" id="tulipSide">
                <img src="bouquet.png" alt="Bouquet" style="width: 100%; max-width: 220px; height: auto; display: block; filter: drop-shadow(0 4px 12px rgba(150,60,30,0.1)); border-radius: 20px;">
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // =====================================================
        // 1. FLOATING PETALS / CONFETTI
        // =====================================================
        const petalContainer = document.getElementById('petals-container');
        const petalEmojis = ['🌷', '❤️', '🌸', '✨', '🌹', '💕', '🌺'];

        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.fontSize = (16 + Math.random() * 28) + 'px';
            petal.style.animationDuration = (3.5 + Math.random() * 4) + 's';
            petal.style.opacity = 0.5 + Math.random() * 0.4;
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;
            petalContainer.appendChild(petal);

            setTimeout(() => {
                if (petal.parentNode) petal.remove();
            }, 8000);
        }

        let petalInterval = null;

        function startPetals() {
            if (petalInterval) return;
            for (let i = 0; i < 20; i++) {
                setTimeout(createPetal, i * 80);
            }
            petalInterval = setInterval(createPetal, 400);
        }

        function stopPetals() {
            if (petalInterval) {
                clearInterval(petalInterval);
                petalInterval = null;
            }
        }

        // =====================================================
        // 2. ENVELOPE OPEN/CLOSE
        // =====================================================
        const envelope = document.getElementById('envelope');
        const closeBtn = document.getElementById('closeBtn');
        let isOpen = false;
        let typewriterStarted = false;

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;
            envelope.classList.add('open');

            startPetals();

            if (!typewriterStarted) {
                startTypewriter();
                typewriterStarted = true;
            }
        }

        function closeEnvelope() {
            isOpen = false;
            envelope.classList.remove('open');
            stopPetals();
        }

        envelope.addEventListener('click', function(e) {
            if (isOpen) return;
            openEnvelope();
        });

        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeEnvelope();
        });

        document.getElementById('letter').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // =====================================================
        // 3. TYPEWRITER EFFECT (Justified & Aligned)
        // =====================================================
        const typewriterText = document.getElementById('typewriterText');
        const cursor = document.getElementById('cursor');
        
        // ✍️ UPDATED LETTER TEXT
        const fullMessage = "I'm so thankful for you and for all the light you bring into my life. Through every high and every low, you're my constant and even on the hardest days, I would still choose us, every single time. Here's to you, to me, and to all the months and years still ahead. May God continue to guide and protect us. I love you more than words could ever say ❤️";

        let typewriterRunning = false;
        let charIndex = 0;

        function startTypewriter() {
            if (typewriterRunning) return;
            typewriterRunning = true;
            charIndex = 0;
            typewriterText.textContent = '';

            function type() {
                if (charIndex >= fullMessage.length) {
                    cursor.classList.add('hidden');
                    typewriterRunning = false;
                    return;
                }

                typewriterText.textContent = fullMessage.substring(0, charIndex + 1);
                charIndex++;

                // Variable speed: pause slightly at punctuation
                const char = fullMessage[charIndex - 1];
                let delay = 25 + Math.random() * 20;
                if (char === '.' || char === ',' || char === '!' || char === '?' || char === '❤') {
                    delay = 120;
                }

                setTimeout(type, delay);
            }

            setTimeout(type, 400);
        }

        // =====================================================
        // 5. CLEANUP
        // =====================================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopPetals();
            } else if (isOpen) {
                startPetals();
            }
        });

        console.log('💌 Click the envelope to open your letter!');

    })();
</script>
</body>
</html>
