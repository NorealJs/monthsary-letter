<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f7ede4 0%, #efddd0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 1.5rem;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        #petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            font-size: 24px;
            animation: fall linear forwards;
            pointer-events: none;
            opacity: 0.7;
            user-select: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 780px;
            perspective: 2000px;
            position: relative;
            z-index: 1;
        }

        .envelope {
            position: relative;
            width: 100%;
            min-height: 520px;
            background: #f5ebe0;
            border-radius: 20px 20px 8px 8px;
            box-shadow: 0 30px 60px rgba(100, 60, 30, 0.25),
                        0 10px 25px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                        box-shadow 0.6s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(200, 170, 140, 0.2);
            overflow: hidden;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(45deg, 
                    transparent,
                    transparent 20px,
                    rgba(200, 170, 140, 0.03) 20px,
                    rgba(200, 170, 140, 0.03) 21px
                );
            pointer-events: none;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: #f0e2d4;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 2px solid rgba(180, 140, 110, 0.15);
            transition: all 0.8s ease;
            pointer-events: none;
        }

        .envelope-seal {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            opacity: 0.6;
            filter: drop-shadow(0 2px 6px rgba(180, 80, 50, 0.15));
            transition: all 0.6s ease;
            pointer-events: none;
            animation: pulseSeal 2s ease-in-out infinite;
        }

        @keyframes pulseSeal {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
        }

        .envelope-hint {
            position: absolute;
            bottom: 2rem;
            font-family: 'Great Vibes', cursive;
            font-size: 1.4rem;
            color: #b08870;
            opacity: 0.5;
            letter-spacing: 3px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 92%;
            max-width: 680px;
            background: #fffcf7;
            border-radius: 16px;
            padding: 2.5rem 2.2rem 2.2rem 2.5rem;
            box-shadow: 0 20px 50px rgba(80, 40, 20, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: stretch;
            border: 1px solid rgba(200, 170, 140, 0.15);
        }

        .envelope.open .letter {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 30px 70px rgba(80, 40, 20, 0.2);
        }

        .envelope.open .envelope-flap {
            clip-path: polygon(0 0, 100% 0, 50% 15%);
            opacity: 0.3;
        }

        .envelope.open .envelope-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .envelope.open .envelope-hint {
            opacity: 0;
        }

        .envelope.open {
            background: #f7efe8;
            box-shadow: 0 20px 50px rgba(100, 60, 30, 0.15);
        }

        .letter-text {
            flex: 1 1 52%;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 0.3rem;
        }

        .greeting {
            font-family: 'Great Vibes', cursive;
            font-size: 2.6rem;
            color: #7a3b2a;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            min-height: 70px;
        }

        .greeting small {
            font-size: 1.8rem;
            display: block;
            margin-top: -0.2rem;
            color: #9e5a44;
        }

        .message-body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            color: #4d2e1f;
            line-height: 1.9;
            margin: 0.4rem 0 0.8rem 0;
            padding-left: 1rem;
            border-left: 3px solid #e8c8b0;
            background: rgba(255, 245, 235, 0.3);
            border-radius: 0 8px 8px 0;
            padding: 0.8rem 0.8rem 0.8rem 1rem;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-body .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #7a3b2a;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        .message-body .typewriter-cursor.hidden {
            opacity: 0;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 1.7rem;
            color: #7a3b2a;
            margin-top: 0rem;
            text-align: right;
            opacity: 0.8;
            min-height: 40px;
        }

        .tulip-side {
            flex: 0 1 38%;
            min-width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 240, 225, 0.2);
            border-radius: 24px;
            padding: 0.2rem;
            position: relative;
            cursor: pointer;
        }

        .tulip-side:hover {
            background: rgba(255, 240, 225, 0.35);
        }

        .tulip-hint {
            position: absolute;
            bottom: 8px;
            font-size: 0.6rem;
            color: #b08870;
            opacity: 0.3;
            font-family: 'Quicksand', sans-serif;
            pointer-events: none;
        }

        #tulipCanvas {
            width: 100%;
            max-width: 220px;
            height: auto;
            aspect-ratio: 1 / 1.15;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(150, 60, 30, 0.1));
            border-radius: 20px;
            transition: filter 0.3s ease;
            cursor: pointer;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #b08870;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            z-index: 10;
        }

        .close-btn:hover {
            opacity: 0.8;
            background: rgba(180, 140, 110, 0.08);
            transform: rotate(90deg);
        }

        @media (max-width: 640px) {
            .envelope { min-height: 440px; padding: 1.5rem 1rem; }
            .letter { padding: 1.8rem 1.2rem; flex-direction: column; gap: 0.8rem; width: 95%; }
            .letter-text { flex: 1 1 auto; padding-right: 0; }
            .tulip-side { flex: 0 1 auto; width: 100%; justify-content: center; }
            #tulipCanvas { max-width: 160px; }
            .greeting { font-size: 2.2rem; }
            .greeting small { font-size: 1.5rem; }
            .message-body { font-size: 0.9rem; padding: 0.4rem 0.6rem; }
            .signature { font-size: 1.4rem; }
            .envelope-seal { font-size: 2.2rem; top: 36%; }
            .envelope-hint { font-size: 1.1rem; bottom: 1.5rem; }
        }

        @media (max-width: 440px) {
            .letter { padding: 1.2rem 0.8rem; }
            .greeting { font-size: 1.8rem; min-height: 50px; }
            .greeting small { font-size: 1.2rem; }
            .message-body { font-size: 0.8rem; padding: 0.3rem 0.5rem; min-height: 80px; }
            #tulipCanvas { max-width: 120px; }
            .envelope-seal { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div id="petals-container"></div>

<div class="container">
    <div class="envelope" id="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-seal">❤️</div>
        <div class="envelope-hint">✉ click to open</div>

        <div class="letter" id="letter">
            <button class="close-btn" id="closeBtn">✕</button>

            <div class="letter-text">
                <div class="greeting" id="greetingText">
                    Happy Birthday
                    <small>mahal ko ❤️</small>
                </div>
                <div class="message-body" id="messageBody">
                    <span id="typewriterText"></span>
                    <span class="typewriter-cursor" id="cursor"></span>
                </div>
                <div class="signature" id="signatureText">— always, yours</div>
            </div>

            <div class="tulip-side" id="tulipSide">
                <canvas id="tulipCanvas" width="400" height="460"></canvas>
                <div class="tulip-hint">🌸 click me</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // =====================================================
        // 1. FLOATING PETALS / CONFETTI
        // =====================================================
        const petalContainer = document.getElementById('petals-container');
        const petalEmojis = ['🌷', '❤️', '🌸', '✨', '🌹', '💕', '🌺'];

        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.fontSize = (16 + Math.random() * 28) + 'px';
            petal.style.animationDuration = (3.5 + Math.random() * 4) + 's';
            petal.style.opacity = 0.5 + Math.random() * 0.4;
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;
            petalContainer.appendChild(petal);

            setTimeout(() => {
                if (petal.parentNode) petal.remove();
            }, 8000);
        }

        let petalInterval = null;

        function startPetals() {
            if (petalInterval) return;
            for (let i = 0; i < 20; i++) {
                setTimeout(createPetal, i * 80);
            }
            petalInterval = setInterval(createPetal, 400);
        }

        function stopPetals() {
            if (petalInterval) {
                clearInterval(petalInterval);
                petalInterval = null;
            }
        }

        // =====================================================
        // 2. ENVELOPE OPEN/CLOSE
        // =====================================================
        const envelope = document.getElementById('envelope');
        const closeBtn = document.getElementById('closeBtn');
        let isOpen = false;
        let typewriterStarted = false;

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;
            envelope.classList.add('open');

            startPetals();

            if (!typewriterStarted) {
                startTypewriter();
                typewriterStarted = true;
            }
        }

        function closeEnvelope() {
            isOpen = false;
            envelope.classList.remove('open');
            stopPetals();
        }

        envelope.addEventListener('click', function(e) {
            if (isOpen) return;
            openEnvelope();
        });

        closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeEnvelope();
        });

        document.getElementById('letter').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        // =====================================================
        // 3. TYPEWRITER EFFECT (Single Paragraph)
        // =====================================================
        const typewriterText = document.getElementById('typewriterText');
        const cursor = document.getElementById('cursor');
        
        // Single paragraph message
        const fullMessage = "I'm so thankful for you and for everything you bring to my life. Here's to us, and to many more months together. May God bless and protect us always. I love you more than you know ❤️";

        let typewriterRunning = false;
        let charIndex = 0;

        function startTypewriter() {
            if (typewriterRunning) return;
            typewriterRunning = true;
            charIndex = 0;
            typewriterText.textContent = '';

            function type() {
                if (charIndex >= fullMessage.length) {
                    cursor.classList.add('hidden');
                    typewriterRunning = false;
                    return;
                }

                typewriterText.textContent = fullMessage.substring(0, charIndex + 1);
                charIndex++;

                // Variable speed: pause slightly at punctuation
                const char = fullMessage[charIndex - 1];
                let delay = 25 + Math.random() * 20;
                if (char === '.' || char === ',' || char === '!' || char === '?' || char === '❤') {
                    delay = 120;
                }

                setTimeout(type, delay);
            }

            setTimeout(type, 400);
        }

        // =====================================================
        // 4. INTERACTIVE TULIP GROWTH
        // =====================================================
        const canvas = document.getElementById('tulipCanvas');
        const ctx = canvas.getContext('2d');
        let bloomLevel = 0.15;
        let targetBloom = 0.15;
        let swayAngle = 0;

        function drawTulip(bloom, sway) {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const cx = 200;
            const baseY = 385;

            ctx.save();
            ctx.translate(cx, baseY);
            ctx.rotate(sway);
            ctx.translate(-cx, -baseY);

            const b = Math.min(1, Math.max(0.1, bloom));
            const spread = 0.6 + b * 0.7;
            const vStretch = 0.8 + b * 0.3;

            // STEM
            ctx.beginPath();
            ctx.moveTo(cx, 285);
            ctx.quadraticCurveTo(cx - 12, 350, cx - 5, baseY - 6);
            ctx.strokeStyle = '#3d6b35';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, 292);
            ctx.quadraticCurveTo(cx - 5, 360, cx - 1, baseY - 10);
            ctx.strokeStyle = '#5a8f4a';
            ctx.lineWidth = 3;
            ctx.stroke();

            // LEAVES
            ctx.beginPath();
            ctx.moveTo(cx - 6, 340);
            ctx.quadraticCurveTo(cx - 50, 295, cx - 85, 320);
            ctx.strokeStyle = '#2f6b2a';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx + 4, 325);
            ctx.quadraticCurveTo(cx + 45, 288, cx + 78, 302);
            ctx.strokeStyle = '#2f6b2a';
            ctx.lineWidth = 7;
            ctx.stroke();

            ctx.strokeStyle = '#4a8a3f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, 333);
            ctx.quadraticCurveTo(cx - 38, 308, cx - 62, 318);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 8, 320);
            ctx.quadraticCurveTo(cx + 34, 300, cx + 56, 306);
            ctx.stroke();

            // bulb
            ctx.beginPath();
            ctx.ellipse(cx - 1, 282, 13, 11, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3d6b35';
            ctx.shadowColor = 'rgba(0,0,0,0.06)';
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;

            // PETALS
            ctx.shadowColor = 'rgba(120,20,10,0.2)';
            ctx.shadowBlur = 12;

            // Back petals
            if (b > 0.2) {
                const backOpacity = Math.min(1, (b - 0.2) * 2);
                ctx.globalAlpha = backOpacity * 0.8;

                let grad = ctx.createRadialGradient(cx - 28, 190, 8, cx - 22, 210, 40);
                grad.addColorStop(0, '#b3121a');
                grad.addColorStop(0.7, '#8a0c12');
                grad.addColorStop(1, '#5f0a0e');
                ctx.beginPath();
                ctx.ellipse(cx - 30 - 10 * (1 - b), 200 - 8 * (1 - b), 28 * spread * 0.9, 42 * vStretch * 0.9, -0.15, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                grad = ctx.createRadialGradient(cx + 28, 190, 8, cx + 22, 210, 40);
                grad.addColorStop(0, '#b3121a');
                grad.addColorStop(0.7, '#8a0c12');
                grad.addColorStop(1, '#5f0a0e');
                ctx.beginPath();
                ctx.ellipse(cx + 30 + 10 * (1 - b), 200 - 8 * (1 - b), 28 * spread * 0.9, 42 * vStretch * 0.9, 0.15, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.globalAlpha = 1;
            }

            // Sepals
            const sepalOpacity = Math.max(0, 1 - b * 1.2);
            ctx.globalAlpha = sepalOpacity;
            if (sepalOpacity > 0.05) {
                let grad = ctx.createRadialGradient(cx - 28, 190, 8, cx - 22, 210, 40);
                grad.addColorStop(0, '#3d7a3a');
                grad.addColorStop(0.7, '#2d5f2a');
                grad.addColorStop(1, '#1e421c');
                ctx.beginPath();
                ctx.ellipse(cx - 30, 200, 26 * spread * 0.7, 46 * vStretch * 0.7, -0.15, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                grad = ctx.createRadialGradient(cx + 28, 190, 8, cx + 22, 210, 40);
                grad.addColorStop(0, '#3d7a3a');
                grad.addColorStop(0.7, '#2d5f2a');
                grad.addColorStop(1, '#1e421c');
                ctx.beginPath();
                ctx.ellipse(cx + 30, 200, 26 * spread * 0.7, 46 * vStretch * 0.7, 0.15, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                grad = ctx.createRadialGradient(cx, 170, 8, cx, 200, 40);
                grad.addColorStop(0, '#4a8a47');
                grad.addColorStop(0.6, '#2d6b2a');
                grad.addColorStop(1, '#1a4a18');
                ctx.beginPath();
                ctx.ellipse(cx, 190, 20 * spread * 0.7, 52 * vStretch * 0.7, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Front petals
            ctx.shadowColor = 'rgba(180,40,20,0.2)';
            ctx.shadowBlur = 14;

            let grad = ctx.createRadialGradient(cx - 50, 200, 8, cx - 35, 220, 50);
            grad.addColorStop(0, '#e6323a');
            grad.addColorStop(0.5, '#ca1f28');
            grad.addColorStop(1, '#98121a');
            ctx.beginPath();
            ctx.ellipse(cx - 45 - 12 * (1 - b), 205 - 6 * (1 - b), 32 * spread, 46 * vStretch, -0.12, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            grad = ctx.createRadialGradient(cx + 50, 200, 8, cx + 35, 220, 50);
            grad.addColorStop(0, '#e6323a');
            grad.addColorStop(0.5, '#ca1f28');
            grad.addColorStop(1, '#98121a');
            ctx.beginPath();
            ctx.ellipse(cx + 45 + 12 * (1 - b), 205 - 6 * (1 - b), 32 * spread, 46 * vStretch, 0.12, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            grad = ctx.createRadialGradient(cx, 185, 15, cx, 210, 60);
            grad.addColorStop(0, '#f54a52');
            grad.addColorStop(0.4, '#e02a33');
            grad.addColorStop(0.8, '#b91620');
            grad.addColorStop(1, '#870e16');
            ctx.beginPath();
            ctx.ellipse(cx, 195 - 8 * (1 - b), 36 * spread, 56 * vStretch, 0, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // highlight
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.ellipse(cx - 8, 170 - 6 * (1 - b), 14 * spread * 0.7, 20 * vStretch * 0.7, -0.08, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 180, 160, 0.12)';
            ctx.fill();

            // veins
            if (b > 0.3) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(100,10,10,0.15)';
                ctx.strokeStyle = 'rgba(120,20,15,0.2)';
                ctx.lineWidth = 1.8;
                const vOff = 8 * (1 - b);
                ctx.beginPath();
                ctx.moveTo(cx - 18, 155 - vOff);
                ctx.quadraticCurveTo(cx - 28, 185 - vOff * 0.4, cx - 34, 220 - vOff * 0.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 18, 155 - vOff);
                ctx.quadraticCurveTo(cx + 28, 185 - vOff * 0.4, cx + 34, 220 - vOff * 0.2);
                ctx.stroke();
            }

            // Stamens
            if (b > 0.25) {
                const stamenOpacity = Math.min(1, (b - 0.25) * 3);
                ctx.globalAlpha = stamenOpacity;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(180,120,20,0.25)';

                ctx.beginPath();
                ctx.ellipse(cx, 168 - 6 * (1 - b), 6 * (0.6 + b * 0.4), 12 * (0.7 + b * 0.3), 0, 0, Math.PI * 2);
                ctx.fillStyle = '#d4a035';
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx, 165 - 6 * (1 - b), 4 * (0.6 + b * 0.4), 8 * (0.7 + b * 0.3), 0, 0, Math.PI * 2);
                ctx.fillStyle = '#f5c542';
                ctx.fill();

                ctx.strokeStyle = '#c9952a';
                ctx.lineWidth = 2;
                const stamenPos = [
                    [cx - 16, 170 - 6 * (1 - b)], [cx - 7, 163 - 6 * (1 - b)],
                    [cx + 7, 163 - 6 * (1 - b)], [cx + 16, 170 - 6 * (1 - b)]
                ];
                stamenPos.forEach((pos) => {
                    ctx.beginPath();
                    ctx.moveTo(pos[0], pos[1] + 6);
                    ctx.lineTo(pos[0] - 1.5, pos[1] + 16);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(pos[0] - 1.5, pos[1] + 18, 2.5 * (0.6 + b * 0.4), 0, Math.PI * 2);
                    ctx.fillStyle = '#d9a32a';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                });

                ctx.globalAlpha = 1;
            }

            // sparkles
            ctx.shadowBlur = 0;
            const sparkleAlpha = 0.05 + b * 0.2;
            ctx.fillStyle = `rgba(255, 245, 220, ${sparkleAlpha})`;
            ctx.beginPath();
            ctx.arc(cx - 38 - 5 * (1 - b), 160 - 8 * (1 - b), 2 + b * 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 38 + 5 * (1 - b), 155 - 8 * (1 - b), 2 + b * 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function animateTulip() {
            bloomLevel += (targetBloom - bloomLevel) * 0.04;
            swayAngle = Math.sin(Date.now() / 2500) * 0.025 * (0.5 + bloomLevel * 0.5);
            drawTulip(bloomLevel, swayAngle);
            requestAnimationFrame(animateTulip);
        }

        let clickCount = 0;
        canvas.addEventListener('click', function(e) {
            e.stopPropagation();
            clickCount = (clickCount % 5) + 1;
            targetBloom = Math.min(1, targetBloom + 0.2);
            
            canvas.style.transition = 'filter 0.2s ease';
            canvas.style.filter = 'drop-shadow(0 4px 20px rgba(200,60,30,0.3))';
            setTimeout(() => {
                canvas.style.filter = 'drop-shadow(0 4px 12px rgba(150,60,30,0.1))';
            }, 300);

            if (targetBloom >= 0.9) {
                setTimeout(() => {
                    targetBloom = 0.15;
                    clickCount = 0;
                }, 3000);
            }
        });

        envelope.addEventListener('click', function(e) {
            if (!isOpen) {
                setTimeout(() => {
                    targetBloom = Math.min(1, targetBloom + 0.25);
                }, 500);
            }
        });

        animateTulip();
        drawTulip(0.15, 0);

        // =====================================================
        // 5. CLEANUP
        // =====================================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopPetals();
            } else if (isOpen) {
                startPetals();
            }
        });

        console.log('💌 Click the envelope to open your letter!');
        console.log('🌸 Click the tulip to make it bloom!');

    })();
</script>
</body>
</html>
